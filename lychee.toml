# Broken-link checker config (https://lychee.cli.rs)
# 401/403/429 usually mean "needs login" or rate-limiting, not a dead link.
accept = ["100..=103", "200..=299", "401", "403", "429"]
max_retries = 2
timeout = 20
user_agent = "Mozilla/5.0 (compatible; sih-links-checker)"

# Internal / login-only hosts that can't be reached from GitHub's runners.
exclude_all_private = true
exclude = [
  'sydney\.edu\.au',
  'sharepoint\.com',
  'office\.com',
  'powerbi\.com',
  'atlassian\.net',
]
